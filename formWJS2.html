<html>
    <head><title>this is form(1)</title></head>
    <style>
        .welcome{
            text-align: left;
            font-size:100px;
            font-family:'Gill Sans';
            color:rgb(104, 2, 2);
            background-color: #4CAF50;
        }
        select {
            width: 30%;
            margin:8px 0;
            padding: 12px 20px;
            box-sizing:border-box;
                }
        input[type=text] {
            width: 30%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
            }
        label
            {
                width: 15%;
                padding: 12px 12px 12px 0;
                display:flex;
                color:rgb(0, 255, 191);
                text-align:right;
                font-weight: bolder;
            }
        .view
        {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            margin:12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;			
            }
        .view:hover 
        {
            background-color: #0cf104;
        }
        .clear 
        {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            margin:12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;			
            }
        .clear:hover 
        {
            background-color: #e91717;
        }

        .final{
                padding-left: 16%;
                
            }
        .image{
            padding-top: 10%;
            width: 100px;
            height:150px;
        }
        .form{
            border-radius: 5px;
            padding-left: 20%;
            width: 80%;
            border-style:solid;
        }
    </style>
    <body background="images/background.jpg">
        <p class="welcome"><u><b></b><i>COUNTRY FLAG FINDER</i></u>🧐</p>
        <form method="post" action="" class="form">			
            <label for="Country">Country:</label>
                <select id="Country" name="Country">
                        <option>-----------</option>
                        <option name="Nepal">Nepal</option>
                        <option name="India">India</option>
                        <option name="Pakistan">Pakistan</option>
                        <option name="USA">USA</option>
                        <option name="China">China</option>
                        <option name="Srilanka">Srilanka</option>
                        <option name="Australia">Australia</option>
                </select><br>
            <div class="final">
            <button type="button" class="view" onclick="Flag()">View</button>
            <button type="button" name="Clear" class="clear" onclick="removeImage()" class="view">Clear</button>
        </form>
        <div class="image" id="image"></div>
        <script>
            var myimage=new Image;
            function Flag(){
                var x = document.getElementById("Country");
                var fl=x.options[x.selectedIndex].text;
                if(fl=="Nepal"){
                    myimage.src="images/nepal.jpg";
                    document.getElementById("image").appendChild(myimage);}
                else if(fl=="India"){
                    myimage.src="images/india.jpg";
                    document.getElementById("image").appendChild(myimage);}
                else if(fl=="Pakistan"){
                    myimage.src="images/pakistan.jpg";
                    document.getElementById("image").appendChild(myimage);}
                else if(fl=="USA"){
                    myimage.src="images/usa.jpg";
                    document.getElementById("image").appendChild(myimage);}
                else if(fl=="China"){
                    myimage.src="images/china.jpg";
                    document.getElementById("image").appendChild(myimage);}
                else if(fl=="Srilanka"){
                    myimage.src="images/srilanka.jpg";
                    document.getElementById("image").appendChild(myimage);}
                else if(fl=="Australia"){
                    myimage.src="images/australia.jpg";
                    document.getElementById("image").appendChild(myimage);}
                }
            function removeImage(){
                document.getElementById("image").removeChild(myimage);
            }

        </script>
        
        </div>
    </body>
</html>
